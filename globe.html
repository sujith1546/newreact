<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Advanced 3D Earth Globe</title>
  <style>
    body { 
      margin: 0; overflow: hidden; background: #000; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    
    #hud { 
      position: absolute; z-index: 10; pointer-events: none; width: 100%; height: 100%; 
      display: flex; flex-direction: column; justify-content: space-between; 
      padding: 24px; box-sizing: border-box; 
    }
    .glass-panel { 
      background: linear-gradient(135deg, rgba(20,25,35,0.7), rgba(10,12,20,0.8)); 
      backdrop-filter: blur(14px); 
      border: 1px solid rgba(255,255,255,0.1); 
      border-radius: 12px; padding: 16px; color: #fff; pointer-events: auto; 
    }
    .top-right { align-self: flex-end; text-align: right; }
    
    .bottom-center { 
      align-self: center; display: flex; gap: 12px; margin-bottom: 20px; 
    }
    button { 
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); 
      color: white; padding: 10px 18px; border-radius: 8px; cursor: pointer; 
      transition: all 0.2s; font-weight: 600; font-size: 14px;
    }
    button:hover { background: rgba(255,255,255,0.25); transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    
    #clock { font-size: 28px; font-weight: bold; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="hud">
    <div class="glass-panel top-right">
      <div id="clock">00:00:00</div>
      <div style="font-size: 11px; color: #999; text-transform: uppercase; margin-top: 4px; letter-spacing: 1px;">IST (UTC+5:30)</div>
    </div>
    <div class="bottom-center">
      <button id="btn-locate" class="glass-panel">🎯 Locate Base</button>
      <button id="btn-night" class="glass-panel">🌙 Night View</button>
    </div>
  </div>

  <script type="module">
    /**
     * Advanced 3D Earth Globe
     * ========================
     * Texture sources: jsdelivr (Three.js examples)
     * To customize, change the 3 constants below:
     */
    const GITHUB_USERNAME = 'sujith1546';
    const TARGET_LAT = 12.9165; // Vellore
    const TARGET_LON = 79.1325;
    
    const TEX_BASE = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures/planets/';
    const TEX_DAY = TEX_BASE + 'earth_atmos_2048.jpg';
    const TEX_NORMAL = TEX_BASE + 'earth_normal_2048.jpg';
    const TEX_SPECULAR = TEX_BASE + 'earth_specular_2048.jpg';
    const TEX_CLOUDS = TEX_BASE + 'earth_clouds_1024.png';
    const GEOJSON_URL = 'https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson';

    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

    // Constants
    const RADIUS = 5;
    const AXIAL_TILT = (23.4 * Math.PI) / 180;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Globals
    let scene, camera, renderer, composer, controls;
    let earthGroup, tiltGroup, cloudsMesh, skylineMesh;
    let nightLayerGroup = new THREE.Group();
    let isNightView = false;
    let targetPulseRing, targetBeam;
    
    // Interaction State
    let mouse = new THREE.Vector2();
    let targetMouse = new THREE.Vector2();
    let lastInteractionTime = performance.now();
    let autoRotate = true;

    init();

    async function init() {
      // 1. Setup Environment
      const container = document.getElementById('canvas-container');
      renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0.5, 19);

      // 9. Post Processing (Bloom)
      const renderScene = new RenderPass(scene, camera);
      const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.5, 0.85);
      composer = new EffectComposer(renderer);
      composer.addPass(renderScene);
      composer.addPass(bloomPass);

      // 8. OrbitControls & Parallax Interaction
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enablePan = false;
      controls.minDistance = 6;
      controls.maxDistance = 40;
      
      const resetIdle = () => { lastInteractionTime = performance.now(); autoRotate = false; };
      controls.addEventListener('start', resetIdle);
      window.addEventListener('mousemove', (e) => {
        if (!reducedMotion) {
          targetMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
          targetMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }
        resetIdle();
      });

      // 8. Starfield (Single BufferGeometry)
      const starGeo = new THREE.BufferGeometry();
      const starCount = 2600;
      const starPos = new Float32Array(starCount * 3);
      for(let i=0; i<starCount*3; i+=3) {
        const r = 80 + Math.random() * 100;
        const theta = 2 * Math.PI * Math.random();
        const phi = Math.acos(2 * Math.random() - 1);
        starPos[i] = r * Math.sin(phi) * Math.cos(theta);
        starPos[i+1] = r * Math.sin(phi) * Math.sin(theta);
        starPos[i+2] = r * Math.cos(phi);
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
      const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.18, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
      scene.add(new THREE.Points(starGeo, starMat));

      // 2. Core Earth & Tilt
      tiltGroup = new THREE.Group();
      tiltGroup.rotation.z = AXIAL_TILT;
      scene.add(tiltGroup);

      earthGroup = new THREE.Group();
      tiltGroup.add(earthGroup);

      // 64 segments for optimization
      const earthGeo = new THREE.SphereGeometry(RADIUS, 64, 64);
      
      // Placeholder while loading
      const placeholderMat = new THREE.MeshPhongMaterial({ color: 0x051020, transparent: true, opacity: 1 });
      const placeholderMesh = new THREE.Mesh(earthGeo, placeholderMat);
      earthGroup.add(placeholderMesh);

      // Robust Texture Loader with Fallback
      const textureLoader = new THREE.TextureLoader();
      textureLoader.crossOrigin = "anonymous";
      
      Promise.all([
        new Promise(res => textureLoader.load(TEX_DAY, res, undefined, () => res(null))),
        new Promise(res => textureLoader.load(TEX_NORMAL, res, undefined, () => res(null))),
        new Promise(res => textureLoader.load(TEX_SPECULAR, res, undefined, () => res(null))),
        new Promise(res => textureLoader.load(TEX_CLOUDS, res, undefined, () => res(null)))
      ]).then(([map, normalMap, specMap, cloudsMap]) => {
        // Build final material even if some textures fail
        const finalMat = new THREE.MeshPhongMaterial({
          map: map || null, 
          normalMap: normalMap || null, 
          specularMap: specMap || null, 
          specular: new THREE.Color(0x333333), 
          shininess: 15, 
          transparent: true, 
          opacity: 0,
          color: map ? 0xffffff : 0x224488 // fallback color if no map
        });
        const finalMesh = new THREE.Mesh(earthGeo, finalMat);
        earthGroup.add(finalMesh);
        
        // Progressive Load Crossfade
        let start = performance.now();
        const fade = () => {
          let t = (performance.now() - start) / 500; // 500ms fade
          if (t > 1) t = 1;
          finalMat.opacity = t;
          if (t < 1) requestAnimationFrame(fade);
          else earthGroup.remove(placeholderMesh);
        };
        fade();

        // 3. Clouds & Atmosphere
        if (cloudsMap) {
          const cloudsGeo = new THREE.SphereGeometry(RADIUS * 1.012, 64, 64);
          const cloudsMat = new THREE.MeshPhongMaterial({ map: cloudsMap, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false });
          cloudsMesh = new THREE.Mesh(cloudsGeo, cloudsMat);
          earthGroup.add(cloudsMesh);
        }
      });

      // Atmosphere Glow (ShaderMaterial)
      const atmosGeo = new THREE.SphereGeometry(RADIUS * 1.15, 64, 64);
      const atmosMat = new THREE.ShaderMaterial({
        vertexShader: `
          varying vec3 vNormal;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vNormal;
          void main() {
            float intensity = pow(0.65 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 4.0);
            gl_FragColor = vec4(0.3, 0.6, 1.0, 1.0) * intensity;
          }
        `,
        side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
      });
      earthGroup.add(new THREE.Mesh(atmosGeo, atmosMat));

      // 4. Real-Time Lighting
      const sunLight = new THREE.DirectionalLight(0xfff5e6, 2.5);
      scene.add(sunLight); 
      // Secondary Rim Light
      const rimLight = new THREE.DirectionalLight(0x4466aa, 0.5);
      rimLight.position.set(-10, -5, -10);
      scene.add(rimLight);
      scene.add(new THREE.AmbientLight(0x111111));

      // Subsolar Point Tracker
      function updateSun() {
        const now = new Date();
        const start = new Date(now.getFullYear(), 0, 0);
        const dayOfYear = Math.floor((now - start) / 86400000);
        
        // Solar declination (lat) and hour angle (lon)
        const declination = 23.44 * Math.sin((2 * Math.PI / 365.24) * (dayOfYear - 81));
        const utcHours = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
        const lon = -15 * (utcHours - 12);
        
        const pos = latLonToVector3(declination, lon, 50);
        // Compensate for scene axial tilt so the sun remains accurate relative to the tilted Earth
        const euler = new THREE.Euler(0, 0, -AXIAL_TILT);
        pos.applyEuler(euler);
        sunLight.position.copy(pos);
      }
      updateSun();
      setInterval(updateSun, 60000); // Check every minute

      earthGroup.add(nightLayerGroup);

      // 5. India Layer (Borders & Cities)
      fetch(GEOJSON_URL).then(r => r.json()).then(data => {
        const india = data.features.find(f => f.properties.ISO_A3 === 'IND');
        if (!india) return;
        
        const lineMat = new THREE.LineBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
        
        const drawPolygon = (ring) => {
          const pts = ring.map(coord => latLonToVector3(coord[1], coord[0], RADIUS * 1.001));
          const geo = new THREE.BufferGeometry().setFromPoints(pts);
          const line = new THREE.LineLoop(geo, lineMat);
          nightLayerGroup.add(line);
        };

        if (india.geometry.type === 'Polygon') {
          india.geometry.coordinates.forEach(drawPolygon);
        } else if (india.geometry.type === 'MultiPolygon') {
          india.geometry.coordinates.forEach(poly => poly.forEach(drawPolygon));
        }
      }).catch(console.error);

      // Emissive City Dots
      const MAJOR_CITIES = [
        [19.0760, 72.8777], [28.7041, 77.1025], [12.9716, 77.5946], [17.3850, 78.4867], 
        [13.0827, 80.2707], [22.5726, 88.3639], [18.5204, 73.8567], [23.0225, 72.5714],
        [21.1702, 72.8311], [26.9124, 75.7873], [26.8467, 80.9462], [26.4499, 80.3319],
        [21.1458, 79.0882], [22.7196, 75.8577], [23.2599, 77.4126], [17.6868, 83.2185],
        [25.5941, 85.1376], [22.3072, 73.1812], [28.6692, 77.4538], [30.9010, 75.8573],
        [27.1767, 78.0081], [19.9975, 73.7898], [28.4089, 77.3178], [28.9845, 77.7064],
        [22.3039, 70.8022], [25.3176, 82.9739], [34.0837, 74.7973], [19.8762, 75.3433],
        [23.7957, 86.4304], [31.6340, 74.8723], [19.0330, 73.0297], [25.4358, 81.8463]
      ];
      const cityGeo = new THREE.SphereGeometry(0.018, 12, 12);
      const cityMatBase = new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0 });
      MAJOR_CITIES.forEach(city => {
        const mesh = new THREE.Mesh(cityGeo, cityMatBase.clone()); 
        mesh.position.copy(latLonToVector3(city[0], city[1], RADIUS * 1.002));
        mesh.userData.phase = Math.random() * Math.PI * 2;
        nightLayerGroup.add(mesh);
      });

      // 7. Target Marker (Vellore)
      const markerPos = latLonToVector3(TARGET_LAT, TARGET_LON, RADIUS * 1.002);
      
      // Central Emissive Dot
      const targetDot = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 16), new THREE.MeshBasicMaterial({ color: 0x00aaff, transparent: true, opacity: 0 }));
      targetDot.position.copy(markerPos);
      nightLayerGroup.add(targetDot);

      // Single Expanding Ring
      targetPulseRing = new THREE.Mesh(
        new THREE.RingGeometry(0.06, 0.08, 32),
        new THREE.MeshBasicMaterial({ color: 0x00aaff, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending })
      );
      targetPulseRing.position.copy(markerPos.clone().multiplyScalar(1.001));
      targetPulseRing.lookAt(0,0,0);
      nightLayerGroup.add(targetPulseRing);

      // Vertical Light Beam
      targetBeam = new THREE.Mesh(
        new THREE.CylinderGeometry(0.015, 0.015, 2, 8, 1, true),
        new THREE.MeshBasicMaterial({ color: 0x00aaff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })
      );
      targetBeam.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), markerPos.clone().normalize());
      targetBeam.position.copy(markerPos.clone().multiplyScalar(1.2)); // shift center out
      nightLayerGroup.add(targetBeam);

      // 6. GitHub Commit Skyline
      fetch(`https://api.github.com/users/${GITHUB_USERNAME}/events/public?per_page=100`)
        .then(r => r.json())
        .then(events => {
          const days = 364;
          const activity = new Array(days).fill(0);
          const today = new Date();
          today.setHours(0,0,0,0);
          
          if(Array.isArray(events)) {
            events.forEach(e => {
              if (e.type === 'PushEvent') {
                const d = new Date(e.created_at);
                d.setHours(0,0,0,0);
                const diff = Math.floor(Math.abs(today - d) / 86400000);
                if (diff < days) activity[days - 1 - diff] += (e.payload.commits?.length || 1);
              }
            });
          }

          // Single draw call for 364 boxes
          const boxGeo = new THREE.BoxGeometry(0.045, 1, 0.045);
          boxGeo.translate(0, 0.5, 0); // Origin at bottom
          const boxMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
          skylineMesh = new THREE.InstancedMesh(boxGeo, boxMat, days);
          
          const dummy = new THREE.Object3D();
          const color = new THREE.Color();
          
          // Span a curved grid across India
          const startLat = 32; 
          const startLon = 70;
          const latSpread = 22; 
          const lonSpread = 20;

          for (let i = 0; i < days; i++) {
            const week = Math.floor(i / 7);
            const day = i % 7;
            const lat = startLat - (day * (latSpread / 7));
            const lon = startLon + (week * (lonSpread / 52));
            
            const pos = latLonToVector3(lat, lon, RADIUS);
            dummy.position.copy(pos);
            dummy.lookAt(0,0,0);
            dummy.rotateX(Math.PI/2); // Align Z to outwards Y
            
            const count = activity[i];
            dummy.scale.set(1, 0.001, 1);
            dummy.updateMatrix();
            skylineMesh.setMatrixAt(i, dummy.matrix);
            
            // Render no-data blocks as muted grey to preserve credibility
            skylineMesh.userData[`targetHeight_${i}`] = count === 0 ? 0.015 : count * 0.05;
            
            if (count === 0) color.setHex(0x222222);
            else if (count <= 2) color.setHex(0x0e4429);
            else if (count <= 4) color.setHex(0x006d32);
            else if (count <= 6) color.setHex(0x26a641);
            else color.setHex(0x39d353);
            
            skylineMesh.setColorAt(i, color);
          }
          skylineMesh.instanceMatrix.needsUpdate = true;
          skylineMesh.instanceColor.needsUpdate = true;
          nightLayerGroup.add(skylineMesh);
        }).catch(e => console.warn("GitHub fetch failed", e));

      // Responsive Resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      });

      // UI Bindings
      document.getElementById('btn-night').addEventListener('click', () => {
        isNightView = !isNightView;
        document.getElementById('btn-night').style.background = isNightView ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.1)';
      });

      document.getElementById('btn-locate').addEventListener('click', () => {
        animState.locating = true;
        animState.startTime = performance.now();
        animState.startRot = earthGroup.rotation.y;
        
        const targetRotY = Math.atan2(-markerPos.x, markerPos.z);
        const currentY = earthGroup.rotation.y % (Math.PI * 2);
        let delta = targetRotY - currentY;
        while(delta < 0) delta += Math.PI * 2;
        
        animState.endRot = earthGroup.rotation.y + delta + Math.PI * 2; // spin 1 full extra time
        animState.startCamZ = camera.position.z;
      });

      animate();
    }

    const animState = { locating: false, startTime: 0, startRot: 0, endRot: 0, startCamZ: 0 };
    
    // Core Math
    function latLonToVector3(lat, lon, radius) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      return new THREE.Vector3(
        -radius * Math.sin(phi) * Math.cos(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.sin(theta)
      );
    }

    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    // Main Render Loop
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();

      // 10. HUD Clock Update
      document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour12: false });

      controls.update();

      // Auto-rotate idle mechanic
      if (autoRotate && !reducedMotion && now - lastInteractionTime > 4000) {
        earthGroup.rotation.y += 0.001;
      }
      
      // Cloud drift
      if (cloudsMesh && !reducedMotion) cloudsMesh.rotation.y += 0.00115;

      // Mouse Parallax
      if (!reducedMotion) {
        mouse.lerp(targetMouse, 0.05);
        camera.position.x += (mouse.x * 2 - camera.position.x) * 0.05;
        camera.position.y += (mouse.y * 2 - camera.position.y) * 0.05;
        camera.lookAt(0,0,0);
      }

      // Camera Dive / Locate Animation
      if (animState.locating) {
        const p = Math.min(1, (now - animState.startTime) / 1500); // 1.5s duration
        earthGroup.rotation.y = animState.startRot + (animState.endRot - animState.startRot) * easeOutBack(p);
        
        const camP = 1 - Math.pow(1 - p, 3);
        camera.position.z = animState.startCamZ + (10 - animState.startCamZ) * camP; // Dive in to 10
        
        if (p >= 1) {
          animState.locating = false;
          earthGroup.rotation.y %= Math.PI * 2;
        }
      }

      // 5. India Layer & Marker Visibility Logic
      const istHour = parseInt(new Date().toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour12: false, hour: 'numeric' }), 10);
      const isNightTime = istHour >= 19 || istHour < 5;
      const layerVisible = isNightView || isNightTime;
      const targetOp = layerVisible ? 1 : 0;

      nightLayerGroup.children.forEach(child => {
        if (child.isLine) {
          // Borders
          child.material.opacity += (targetOp * 0.7 - child.material.opacity) * 0.05;
        } else if (child.isMesh && child.geometry.type === 'SphereGeometry') {
          // City dots or Marker
          const isMarker = child.material.color.getHex() === 0x00aaff;
          if (isMarker) {
            child.material.opacity += (targetOp * 0.9 - child.material.opacity) * 0.05;
          } else {
            let twinkle = 1;
            if (!reducedMotion && targetOp > 0.5) {
              twinkle = 0.5 + 0.5 * Math.sin(now * 0.003 + child.userData.phase);
            }
            child.material.opacity += (targetOp * twinkle - child.material.opacity) * 0.05;
          }
        } else if (child === targetPulseRing) {
          // Radar pulse logic
          if (!reducedMotion && targetOp > 0) {
            const scale = 1 + (now % 2000) / 2000 * 3;
            child.scale.set(scale, scale, scale);
            child.material.opacity = targetOp * (1 - (now % 2000)/2000);
          } else {
             child.material.opacity += (0 - child.material.opacity) * 0.05;
          }
        } else if (child === targetBeam) {
          child.material.opacity += (targetOp * 0.65 - child.material.opacity) * 0.05;
        }
      });

      // 6. Skyline Animation
      if (skylineMesh) {
        skylineMesh.material.opacity += (targetOp * 0.9 - skylineMesh.material.opacity) * 0.05;
        if (targetOp > 0.1 && !reducedMotion) {
          const dummy = new THREE.Object3D();
          const mat4 = new THREE.Matrix4();
          for (let i = 0; i < 364; i++) {
            skylineMesh.getMatrixAt(i, mat4);
            mat4.decompose(dummy.position, dummy.quaternion, dummy.scale);
            const targetH = skylineMesh.userData[`targetHeight_${i}`];
            if (Math.abs(dummy.scale.y - targetH) > 0.001) {
              // Stagger growth based on array index to create a "wave" effect on load
              const delay = i * 5; 
              if (now > delay) {
                dummy.scale.y += (targetH - dummy.scale.y) * 0.08;
                dummy.updateMatrix();
                skylineMesh.setMatrixAt(i, dummy.matrix);
              }
            }
          }
          skylineMesh.instanceMatrix.needsUpdate = true;
        }
      }

      // Use composer instead of renderer to enable Bloom
      composer.render();
    }
  </script>
</body>
</html>
