    <!-- ══════════════ SECURITY HEADERS ══════════════ -->
    <!-- Content Security Policy v3: restricts script execution, data sources, and connection targets -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'
        https://cdnjs.cloudflare.com
        https://cdn.jsdelivr.net
        https://fonts.googleapis.com;
      style-src 'self' 'unsafe-inline'
        https://fonts.googleapis.com
        https://cdnjs.cloudflare.com
        https://cdn.jsdelivr.net;
      font-src 'self' data:
        https://fonts.gstatic.com
        https://cdnjs.cloudflare.com
        https://cdn.jsdelivr.net;
      img-src 'self' data: blob:
        https://*.supabase.co
        https://sujith-thota.vercel.app;
      connect-src 'self'
        https://*.supabase.co
        wss://*.supabase.co
        https://api.groq.com
        https://api.abuseipdb.com;
      media-src 'self' blob:;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
      upgrade-insecure-requests;
      report-uri /api/csp-report;
    " />
    <!-- Prevent this page being embedded in iframes (clickjacking protection) -->
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <!-- Prevent MIME sniffing attacks -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- Limit referrer information leakage -->
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <!-- Restrict access to sensitive browser APIs -->
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), payment=(), usb=(), bluetooth=(), geolocation=(self), accelerometer=(), gyroscope=()" />
    <!-- ══════════════════════════════════════════════ -->
